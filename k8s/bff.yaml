apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-service
  namespace: whoisoncall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-service
  template:
    metadata:
      labels:
        app: bff-service
    spec:
      containers:
      - name: bff
        image: whoisoncall-bff:latest
        imagePullPolicy: Never
        env:
        - name: PORT
          value: "4000"
---
apiVersion: v1
kind: Service
metadata:
  name: bff-service
  namespace: whoisoncall
spec:
  type: NodePort
  selector:
    app: bff-service
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30000
