apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: whoisoncall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
      - name: backend
        image: whoisoncall-backend:latest
        imagePullPolicy: Never
        env:
        - name: PORT
          value: "3000"
        - name: SERVICE_ID
          value: "checkout-service"
        - name: SERVICE_NAME
          value: "CarvedRockWebShop (Checkout)"
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: whoisoncall
spec:
  selector:
    app: checkout-service
  ports:
    - port: 3000
      targetPort: 3000
---
