global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - 'rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'whoisoncall-microservices'
    static_configs:
      - targets:
        - 'checkout-service:3000'
        - 'auth-service:3000'
        - 'inventory-service:3000'
